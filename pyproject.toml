[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rvs"
version = "0.5.0"
description = "rvs - robot-visual-reflex-system：vus 之上的机器人视觉反射系统——本体感受门控 + 外围视觉 + 语义反射弧 + 行动条件化感知"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "rvs contributors" }]
keywords = ["robot", "video-understanding", "realtime", "ego-motion", "vlm"]
dependencies = [
    "vus @ git+https://github.com/CommitStrip/video-understanding-skill.git@01d1f10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["rvs"]
